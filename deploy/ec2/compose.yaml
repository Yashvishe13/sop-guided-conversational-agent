# Hosted demo: Caddy terminates HTTPS (automatic certificate) and proxies to the app.
# The app is not published on the host; only Caddy listens on 80/443.
services:
  app:
    image: insurance-claims-agent:amd64
    env_file: .env            # OPENAI_API_KEY, STATE_ENCRYPTION_KEY (root-only file on the instance)
    environment:
      APP_ENV: production     # requires the external encryption key; Secure cookies
      MODEL_PROVIDER: openai
      EMAIL_TRANSPORT: outbox
    volumes:
      - claims-data:/data
    restart: unless-stopped
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DEMO_HOST: ${DEMO_HOST}   # e.g. 98-81-151-1.sslip.io (the public IP with dashes)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  claims-data:
  caddy-data:
