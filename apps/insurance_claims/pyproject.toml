[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "insurance-claims-agent"
version = "0.2.0"
description = "SOP-guided insurance claims support agent (FastAPI + gpt-5.6-luna) built as a guarded ReAct tool loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.24,<4",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "pydantic>=2.13,<3",
    "cryptography>=50,<60",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<1",
]
browser = [
    "playwright>=1.50",
]

[project.scripts]
insurance-claims-traces = "insurance_claims.observability.trace_reader:main"

[tool.hatch.build.targets.wheel]
packages = ["src/insurance_claims"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not browser'"
markers = [
    "live: calls the real OpenAI API (opt-in, never part of the unit suite)",
    "browser: drives a real browser against a running server",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "UP035", "SIM105", "SIM108", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "B023"]
