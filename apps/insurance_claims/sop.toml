# The claims support SOP (standard operating procedure), as data.
#
# This file is the single definition of the workflow. The application loads and validates it at
# startup (agent/sop.py) and refuses to start if it is inconsistent. It drives:
#   * the phase order,
#   * which tools the agent may call in each phase (and the conditions some tools need),
#   * every phase transition: code may only change the phase along a transition listed here.
# Each strict rule names the code that enforces it ("enforced_by"); an unknown name is a startup
# error, and so is an enforcement point that no rule mentions. The "flexible" lists record what is
# deliberately left to the model's judgement. docs/SOP.md is generated from this file
# (python -m insurance_claims.agent.sop > docs/SOP.md).
#
# Prompt wording for each phase lives in prompts.toml; numeric limits (refusals, off-topic
# requests, failed attempts, idle time) are settings (see the README).

version = "2026-10-04.sop-1"

[workflow]
phases = ["VERIFY_ID", "RESOLVE_INTENT", "PROCESS_CASE", "POST_PROCESS"]
always_available = ["request_human"]
always_strict = [
  { rule = "Every caller message is reviewed by the guard before the agent runs (who is speaking, refusals, off-topic requests, what claim they describe).", enforced_by = "guard.caller_review" },
  { rule = "Every reply the agent drafts is checked by code (style, internal details, grounding of IDs, amounts, dates, status) and then reviewed by the guard (facts against the record, disclosure, promises, scope, required content) before the caller sees it.", enforced_by = "guard.reply_review" },
  { rule = "When the off-topic or refusal limit is reached, the caller acts for someone else, or verification locks, the reply must offer a human representative.", enforced_by = "reply.required_human_offer" },
  { rule = "A tool outside the current phase's menu is refused, even if the model calls it.", enforced_by = "tools.phase_menu" },
  { rule = "Someone acting for the policyholder, or a new person after verification, loses access and starts over at VERIFY_ID.", enforced_by = "access.withdraw_on_new_speaker" },
  { rule = "After the idle time limit, verification expires and the caller must verify again.", enforced_by = "verification.idle_expiry" },
]
always_flexible = [
  "Tone, empathy, and wording of every reply.",
  "Acknowledging emotions first, explaining why a step matters, and keeping the conversation moving.",
  "Declining unrelated requests politely and steering back.",
  "Asking for a human at any time; the agent hands over with request_human.",
]

[phases.VERIFY_ID]
goal = "Confirm the caller is the policyholder before anything about any claim is shared."
tools = ["verify_identity"]
strict = [
  { rule = "No claim information at all is disclosed before verification.", enforced_by = "reply.pre_verification_leak" },
  { rule = "Only the account holder can be verified; someone acting for another person is refused for the rest of the conversation.", enforced_by = "verify_identity.speaker_confirmed" },
  { rule = "Identity values count only if the caller actually said them.", enforced_by = "verify_identity.grounded_values" },
  { rule = "At least three distinct identity fields are required (full name, date of birth, phone, email, SSN or national ID last four); a policy number never counts.", enforced_by = "verify_identity.three_fields" },
  { rule = "All fields must match exactly one policyholder with no conflicting field, and the reply never says which field failed.", enforced_by = "verify_identity.unique_match" },
  { rule = "Repeated failures lock verification, per conversation and per policyholder across conversations.", enforced_by = "verify_identity.lockout" },
  { rule = "Refusals are counted by code; the agent may hand over for repeated refusal only after the limit.", enforced_by = "caller_review.refusal_count" },
  { rule = "When three identity details were given, the agent must try verification instead of asking for more.", enforced_by = "reply.missed_verification" },
]
flexible = [
  "Which details to ask for, in what order, and how to handle partial answers, corrections, and clarifying questions.",
  "Offering alternative identity fields when the caller cannot or will not give one.",
  "How to persuade gently after a refusal, and when the conversation needs a human.",
]

[phases.RESOLVE_INTENT]
goal = "Find which of the verified caller's claims they mean, without making them start over."
tools = ["list_my_claims", "select_claim"]
strict = [
  { rule = "Only the verified caller's own claims can be listed or selected; another party's claim ID is reported as not found.", enforced_by = "claims.party_scoped" },
]
flexible = [
  "Matching the remembered description to a claim, and asking one short question when several fit.",
]

[phases.PROCESS_CASE]
goal = "Explain the selected claim from its record and move it toward resolution."
tools = [
  "list_my_claims",
  "select_claim",
  "get_claim_details",
  "get_document_guidance",
  "get_followup_guidance",
  "record_document_status",
  "offer_email_summary",
]
strict = [
  { rule = "Every statement about the claim must be supported by the record, the tool results, or the caller's own words.", enforced_by = "reply.grounding" },
  { rule = "No guaranteed outcomes, no appeal rights beyond the record, and no claims that the agent submitted or received anything.", enforced_by = "reply.grounding" },
  { rule = "A document status is stored only when the caller's words say the same.", enforced_by = "guard.document_status" },
  { rule = "The email summary must name the claim, its status, and every outstanding document, and every statement must be supported.", enforced_by = "guard.summary_check" },
  { rule = "A claim conversation may not end without offering the email summary.", enforced_by = "reply.email_offer_before_goodbye" },
]
flexible = [
  "What to explain first, which follow-up questions to ask, and when the claim is covered.",
  "Answering side questions from the guidance and returning to the open point.",
]

[phases.POST_PROCESS]
goal = "Offer the email summary, record the caller's explicit choice, and close or return to the claim."
tools = [
  "list_my_claims",
  "select_claim",
  "get_claim_details",
  "get_document_guidance",
  "get_followup_guidance",
  "record_email_decision",
  "offer_email_summary",
]
strict = [
  { rule = "A typed choice is recorded only when the guard reads the same choice in the caller's own words; Send and Skip buttons work only on an open offer.", enforced_by = "guard.consent_check" },
  { rule = "Consent can never come in the same turn as the offer, and the email goes only to the address on file.", enforced_by = "email.consent_rules" },
  { rule = "The reply never says the email was sent; the application reports the real delivery result.", enforced_by = "email.truthful_status" },
]
flexible = [
  "Answering more questions about the same claim while the offer stays open.",
  "Re-offering the summary after a skip or a failed send.",
]

# Some tools in a phase's menu need a condition (named conditions are defined in agent/sop.py).
[phases.POST_PROCESS.conditions]
record_email_decision = "email_offer_open"
offer_email_summary = "no_open_offer_or_send"

# The only phase changes code may make. "event" is what the code reports; "from" lists the phases
# it may happen in.
[[transitions]]
event = "identity_verified"
from = ["VERIFY_ID"]
to = "RESOLVE_INTENT"
trigger = "verify_identity returns verified"

[[transitions]]
event = "claim_selected"
from = ["RESOLVE_INTENT", "PROCESS_CASE", "POST_PROCESS"]
to = "PROCESS_CASE"
trigger = "select_claim succeeds (in POST_PROCESS only when switching to another claim, which withdraws an open offer)"

[[transitions]]
event = "email_summary_offered"
from = ["PROCESS_CASE", "POST_PROCESS"]
to = "POST_PROCESS"
trigger = "offer_email_summary is accepted"

[[transitions]]
event = "case_question_after_wrap_up"
from = ["POST_PROCESS"]
to = "PROCESS_CASE"
trigger = "a claim tool is used after the wrap-up when no offer is open"

[[transitions]]
event = "caller_changed"
from = ["RESOLVE_INTENT", "PROCESS_CASE", "POST_PROCESS"]
to = "VERIFY_ID"
trigger = "the guard finds a different person, or someone acting for the policyholder, after verification"

[[transitions]]
event = "verification_expired"
from = ["RESOLVE_INTENT", "PROCESS_CASE", "POST_PROCESS"]
to = "VERIFY_ID"
trigger = "the caller was idle longer than the verification time limit"

# What is remembered across phase boundaries.
[[memory]]
what = "Why the caller is calling and which claim they describe (type, status, month, year)"
captured = "In any phase, from the guard's review of every caller message, even before verification"
used = "After verification, to select the claim without asking again"
cleared = "When access is withdrawn (a new person or someone acting for the policyholder)"

[[memory]]
what = "What the caller said about each required document"
captured = "PROCESS_CASE, through record_document_status (confirmed by the guard)"
used = "Later replies, the email summary, and its fact check"
cleared = "When access is withdrawn"

[[memory]]
what = "The conversation itself"
captured = "Every turn, stored encrypted"
used = "Recent messages since the last identity reset are given to the agent and the guard"
cleared = "Messages before an identity reset (expiry or a new person) are never shown to a model again"
